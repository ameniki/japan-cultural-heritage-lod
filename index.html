<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日本の世界文化遺産LOD</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.7;
      color: #172033;
      background: #f5f2eb;
    }
    body {
      margin: 0;
    }
    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 64px 24px;
    }
    .card {
      padding: 36px;
      border: 1px solid #d9d3c5;
      border-radius: 18px;
      background: #fffdf8;
      box-shadow: 0 16px 48px rgb(40 35 25 / 8%);
    }
    h1 {
      margin-top: 0;
      line-height: 1.25;
    }
    .stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 28px 0;
    }
    .stat {
      min-width: 150px;
      padding: 14px 18px;
      border-radius: 12px;
      background: #eef4ed;
    }
    .stat strong {
      display: block;
      font-size: 1.7rem;
      color: #29523b;
    }
    a {
      color: #0d5d78;
    }
    .button {
      display: inline-block;
      margin: 8px 8px 0 0;
      padding: 10px 16px;
      border-radius: 10px;
      color: white;
      background: #0d5d78;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1>日本の世界文化遺産LOD</h1>
      <p>
        Wikidataのオープンデータを基に、日本に関係する世界文化遺産を
        RDFとして整理したLinked Open Dataです。
      </p>
      <div class="stats">
        <div class="stat"><strong>21</strong>世界文化遺産</div>
        <div class="stat"><strong>6</strong>文化遺産評価基準</div>
      </div>
      <p>
        各遺産をHTTP URIで識別し、Wikidataの同一リソースと
        UNESCO World Heritage Centreの個別ページへリンクしています。
      </p>
      <a class="button" href="japan-cultural-heritage.ttl">
        Turtleデータを開く
      </a>
      <a class="button" href="https://github.com/ameniki/japan-cultural-heritage-lod">
        GitHubリポジトリ
      </a>
      <p>
        ライセンス: <a href="LICENSE">CC0 1.0 Universal</a>
      </p>
    </section>
  </main>
</body>
</html>
